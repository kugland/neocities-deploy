[workspace]
members = [
    "deploy",
    "client",
]
resolver = "2"

[workspace.package]
authors = ["André Kugland <kugland@gmail.com>"]
repository = "https://github.com/kugland/neocities-deploy"
version = "0.1.29"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.88.0"

[workspace.dependencies]
indoc = "2.0.5"
log = "0.4.32"
mockito = "1.7.2"
parse-display = { version = "0.11.0", default-features = false }
serde = { version = "1.0.200", features = ["derive"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"
